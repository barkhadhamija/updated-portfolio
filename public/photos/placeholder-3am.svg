<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 390" role="img" aria-label="A laptop, a stack of books and coffee late at night">
  <!-- placeholder for the "3 a.m., still shipping" polaroid: a Rory-at-Yale all-nighter -->
  <rect width="450" height="390" fill="#2A2350"/>
  <!-- window with the moon -->
  <rect x="290" y="30" width="126" height="120" rx="8" fill="#3A3170" stroke="#111111" stroke-width="5"/>
  <line x1="353" y1="30" x2="353" y2="150" stroke="#111111" stroke-width="5"/>
  <line x1="290" y1="90" x2="416" y2="90" stroke="#111111" stroke-width="5"/>
  <circle cx="385" cy="60" r="16" fill="#FFE14D"/>
  <circle cx="378" cy="55" r="16" fill="#3A3170"/>
  <g fill="#FFFFFF"><circle cx="312" cy="118" r="2.5"/><circle cx="330" cy="58" r="2"/><circle cx="398" cy="122" r="2.5"/></g>
  <!-- Yale pennant -->
  <path d="M40 46l150 26-150 26z" fill="#0F4D92" stroke="#111111" stroke-width="4" stroke-linejoin="round"/>
  <text x="58" y="80" font-family="Georgia, serif" font-weight="700" font-size="22" fill="#FFFFFF">YALE</text>
  <!-- desk -->
  <rect x="0" y="318" width="450" height="72" fill="#6B4A8F"/>
  <rect x="0" y="318" width="450" height="10" fill="#8562AB"/>
  <!-- laptop -->
  <rect x="150" y="190" width="170" height="112" rx="8" fill="#111111"/>
  <rect x="160" y="200" width="150" height="92" rx="3" fill="#15151F"/>
  <g stroke-width="6" stroke-linecap="round">
    <line x1="172" y1="216" x2="226" y2="216" stroke="#C6FF3D"/>
    <line x1="186" y1="232" x2="262" y2="232" stroke="#B69CFF"/>
    <line x1="186" y1="248" x2="240" y2="248" stroke="#FF4FA3"/>
    <line x1="172" y1="264" x2="210" y2="264" stroke="#C6FF3D"/>
    <line x1="186" y1="280" x2="250" y2="280" stroke="#FFFFFF" opacity="0.5"/>
  </g>
  <path d="M130 302h210l-14 18H144z" fill="#C9C4D8" stroke="#111111" stroke-width="4" stroke-linejoin="round"/>
  <!-- book stack -->
  <g stroke="#111111" stroke-width="4">
    <rect x="30" y="286" width="104" height="30" rx="3" fill="#FFE14D"/>
    <rect x="38" y="256" width="92" height="30" rx="3" fill="#2BD49B"/>
    <rect x="26" y="226" width="100" height="30" rx="3" fill="#FF7A1A"/>
  </g>
  <g font-family="Georgia, serif" font-size="14" fill="#111111" text-anchor="middle">
    <text x="82" y="306">Austen</text>
    <text x="84" y="276">Plath</text>
    <text x="76" y="246">Dickens</text>
  </g>
  <!-- coffee -->
  <g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <path d="M368 230c-10-12 10-18 0-32"/>
    <path d="M390 230c-10-12 10-18 0-32"/>
  </g>
  <path d="M408 262h8a16 16 0 0 1 0 32h-8" fill="none" stroke="#111111" stroke-width="10"/>
  <path d="M408 262h8a16 16 0 0 1 0 32h-8" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <rect x="350" y="244" width="62" height="74" rx="10" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
  <text x="381" y="290" text-anchor="middle" font-family="ui-monospace, monospace" font-weight="700" font-size="16" fill="#111111">3AM</text>
</svg>
