<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 390" role="img" aria-label="A Luke's Diner coffee mug next to a book">
  <!-- placeholder for the "me, probably mid-sip" polaroid: Luke's Diner, Stars Hollow -->
  <rect width="450" height="390" fill="#2E5BFF"/>
  <!-- diner window sign -->
  <rect x="40" y="34" width="190" height="58" rx="10" fill="#111111"/>
  <text x="135" y="74" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-weight="700" font-size="34" fill="#FFE14D">Luke’s</text>
  <text x="300" y="58" font-family="ui-monospace, monospace" font-size="15" fill="#FFFFFF" opacity="0.85">NO CELL</text>
  <text x="300" y="78" font-family="ui-monospace, monospace" font-size="15" fill="#FFFFFF" opacity="0.85">PHONES</text>
  <!-- counter -->
  <rect x="0" y="300" width="450" height="90" fill="#8A5A3B"/>
  <rect x="0" y="300" width="450" height="12" fill="#A9714C"/>
  <!-- book -->
  <g transform="rotate(-8 330 290)">
    <rect x="270" y="252" width="130" height="46" rx="4" fill="#FF4FA3" stroke="#111111" stroke-width="4"/>
    <rect x="270" y="252" width="130" height="12" fill="#111111"/>
    <text x="335" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#111111">Proust</text>
  </g>
  <!-- steam -->
  <g fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <path d="M128 150c-14-16 14-26 0-44"/>
    <path d="M158 140c-14-16 14-26 0-44"/>
    <path d="M188 150c-14-16 14-26 0-44"/>
  </g>
  <!-- mug -->
  <path d="M232 214h18a26 26 0 0 1 0 52h-18" fill="none" stroke="#111111" stroke-width="12"/>
  <path d="M232 214h18a26 26 0 0 1 0 52h-18" fill="none" stroke="#FFFFFF" stroke-width="5"/>
  <rect x="96" y="168" width="140" height="138" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
  <ellipse cx="166" cy="172" rx="66" ry="12" fill="#3B2314"/>
  <text x="166" y="252" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-weight="700" font-size="30" fill="#111111">Luke’s</text>
  <text x="166" y="278" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#111111">STARS HOLLOW</text>
</svg>
